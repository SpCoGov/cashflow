[package]
name = "cashflow"
version = "0.1.0"
edition = "2024"

[lib]
name = "cashflow_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
serde_yaml = "0.9"
regex = "1"
chrono = "0.4"
calamine = { version = "0.38.0", features = ["chrono"] }
csv = "1"
rust_xlsxwriter = "0.102.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
