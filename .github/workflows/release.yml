# 发布新版本时自动打包：推送 v* 标签（或在 Releases 页面用新标签发布）后，
# 构建 Windows 安装包 + 便携版、macOS 通用 dmg，并上传到同名 GitHub Release。
# 版本号取自标签（v1.2.3 → 1.2.3），无需修改仓库里的版本号；带 - 的标签（如 v1.2.3-beta.1）标记为预发布。
# 也可以在 Actions 页面手动运行，填写一个已存在的标签重新打包。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要打包的标签，如 v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 测试
        if: runner.os == 'Windows'
        run: npm test

      - name: 打包
        run: node scripts/package.mjs ${{ env.TAG }}

      - uses: actions/upload-artifact@v7
        with:
          name: cashflow-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
